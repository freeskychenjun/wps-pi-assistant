<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="ver" content="dev">
</head>
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/taskpane.js"></script>
<script type="text/javascript" src="../.debugTemp/wpsjsrpcsdk.js"></script>

<body>
    <div class="app">

        <!-- 顶栏：品牌 + 连接状态 -->
        <header class="hdr">
            <div class="brand">
                <span class="logo">π</span>
                <span class="title">pi 文档助手</span>
            </div>
            <span id="connState" class="badge">连接中…</span>
        </header>

        <!-- 配置区：默认折叠，只占一行 -->
        <section class="cfgwrap">
            <div class="cfgbar">
                <a href="javascript:void(0)" onclick="toggleCfg()" id="cfgToggle" class="link">▸ 模型</a>
                <span id="cfgCurModel" class="cfgcur"></span>
                <span class="cfgbar-right">
                    <a href="javascript:void(0)" onclick="newChat()" class="link">新对话</a>
                    <a href="javascript:void(0)" onclick="showSessionList()" class="link">历史</a>
                    <a href="javascript:void(0)" onclick="runProbe()" class="link muted">诊断</a>
                </span>
            </div>
            <div id="cfgBox" class="cfgbox" style="display:none">
                <div class="modelrow">
                    <select id="cfgSel" title="下面列出 pi 里已配置好的模型（provider 有凭据的排前面）"></select>
                    <button class="btn primary sm" onclick="applyModel()">应用</button>
                    <button class="btn ghost sm" onclick="loadModels(true)" title="重新读取 pi --list-models">↻</button>
                </div>
                <div class="cfgfoot"><span id="cfgMsg" class="cfgmsg"></span></div>
                <a href="javascript:void(0)" onclick="toggleCfgManual()" class="link muted" id="cfgManualToggle">▸ 自定义 provider / model / API Key</a>
                <div id="cfgManual" style="display:none">
                    <label class="field"><span>provider</span>
                        <input id="cfgProvider" placeholder="anthropic / openai / deepseek…"></label>
                    <label class="field"><span>model</span>
                        <input id="cfgModel" placeholder="模型 ID，留空用默认"></label>
                    <label class="field"><span>API Key</span>
                        <input id="cfgKey" type="password" placeholder="留空沿用 pi 现有配置"></label>
                    <div class="cfgfoot">
                        <button class="btn primary sm" onclick="saveCfg()">保存并启动</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 对话区 -->
        <main id="chatBox" class="chat">
            <div class="hint" id="emptyHint">
                <div class="hintIcon">✎</div>
                <div>把光标放到要改的段落，直接说要改什么</div>
                <div class="hintEg">「改得更正式一些」<br>「把这张表的空单元格补上」<br>「全文里把 2024 改成 2025」<br>「在表后说明后加一段：复核人：陈鋆」</div>
            </div>
        </main>

        <!-- 输入区 -->
        <footer class="composer">
            <div id="cmdMenu" class="cmdmenu" style="display:none"></div>
            <textarea id="userInput" rows="2" oninput="onInputChange(this)"
                placeholder="说说要改什么，Ctrl+Enter 发送；输入 / 呼出技能"></textarea>
            <div class="bar">
                <span class="autoTip" title="发送时会附上光标处的段落或表格摘要；agent 需要别的内容会自己用只读工具读取（段落/表格/大纲/全文/检索）">自动读取文档 · 光标处摘要</span>
                <div class="btns">
                    <button class="btn ghost" onclick="stopPi()" title="停止当前生成">停止</button>
                    <button class="btn primary" onclick="sendMsg()">发送</button>
                </div>
            </div>
            <button id="undoBtn" class="btn undo" onclick="undoLastTurn()" disabled>撤销上轮 AI 修订</button>
        </footer>

    </div>
</body>

<style>
    :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --line: #e8ebef;
        --text: #1f2329;
        --muted: #8a919b;
        --accent: #2f6fed;
    }

    html,
    body {
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;
        /* 窗格 webview 的视口比可见区域略高（WPS 状态栏遮挡），禁止整页滚动 */
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
    }

    * {
        box-sizing: border-box;
    }

    .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 230px;
        overflow: hidden;
    }

    /* ---------- 顶栏 ---------- */
    .hdr {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 9px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
    }

    .logo {
        flex: 0 0 auto;
        width: 21px;
        height: 21px;
        border-radius: 6px;
        background: linear-gradient(135deg, #5b93ff, #2f6fed);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        line-height: 21px;
        text-align: center;
        box-shadow: 0 1px 3px rgba(47, 111, 237, .35);
    }

    .title {
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: .2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .badge {
        flex: 0 0 auto;
        font-size: 11px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 10px;
        background: #f1f3f5;
        color: var(--muted);
        white-space: nowrap;
    }

    .badge.ok {
        background: #e7f7ef;
        color: #1f9d63;
    }

    .badge.err {
        background: #fdecec;
        color: #d64545;
    }

    .badge.warn {
        background: #fdf3e3;
        color: #b9770e;
    }

    /* ---------- 配置区 ---------- */
    .cfgwrap {
        flex: 0 0 auto;
        background: #fafbfc;
        border-bottom: 1px solid var(--line);
    }

    .cfgbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 12px;
        font-size: 12px;
    }

    .link {
        color: #5a6472;
        text-decoration: none;
        cursor: pointer;
    }

    .link:hover {
        color: var(--accent);
    }

    .link.muted {
        color: #a5adb8;
        font-size: 11.5px;
    }

    /* 配置条右侧的「新对话 / 历史 / 诊断」 */
    .cfgbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    /* 历史会话列表 */
    .sessitem {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        margin-bottom: 6px;
    }

    .sessitem:hover { border-color: #b9cdf5; background: #f7faff; }

    .sessitem.cur { border-color: var(--accent); background: #f0f5ff; }
    .sessitem.dis { opacity: .5; cursor: default; }
    .sessitem.dis:hover { border-color: var(--line); background: var(--panel); }

    .sessitem .t {
        font-size: 12px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .sessitem .m {
        font-size: 10.5px;
        color: var(--muted);
    }

    .cfgbox {
        padding: 2px 12px 11px;
    }

    /* 模型下拉：占满一行，右侧「应用 / 刷新」两个小按钮 */
    .modelrow {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .modelrow select {
        flex: 1 1 auto;
        min-width: 0;
        height: 29px;
        padding: 0 6px;
        font-size: 12.5px;
        color: var(--text);
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 7px;
        outline: none;
    }

    .modelrow select:focus {
        border-color: #8fb3ff;
        box-shadow: 0 0 0 3px rgba(47, 111, 237, .12);
    }

    .modelrow .btn {
        flex: 0 0 auto;
    }

    /* 顶栏上的当前模型名 */
    .cfgcur {
        margin-left: 6px;
        font-size: 11.5px;
        color: var(--muted);
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .field {
        display: block;
        margin-bottom: 7px;
        font-size: 11px;
        color: var(--muted);
    }

    .field>span {
        display: block;
        margin-bottom: 3px;
        letter-spacing: .3px;
    }

    .field input {
        width: 100%;
        height: 29px;
        padding: 0 8px;
        font-size: 12.5px;
        color: var(--text);
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 7px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    .field input:focus {
        border-color: #8fb3ff;
        box-shadow: 0 0 0 3px rgba(47, 111, 237, .12);
    }

    .cfgfoot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 9px;
    }

    .cfgmsg {
        font-size: 11.5px;
        color: var(--muted);
    }

    /* ---------- 对话区 ---------- */
    .chat {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 12px 8px;
        scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
        width: 8px;
    }

    .chat::-webkit-scrollbar-thumb {
        background: #d8dde4;
        border-radius: 4px;
    }

    .chat::-webkit-scrollbar-thumb:hover {
        background: #c4cbd4;
    }

    .hint {
        margin: auto;
        padding: 8px 4px;
        text-align: center;
        color: #a9b1bb;
        font-size: 12px;
        line-height: 1.75;
    }

    .hintIcon {
        font-size: 20px;
        opacity: .5;
        margin-bottom: 6px;
    }

    .hintEg {
        margin-top: 10px;
        font-size: 11.5px;
        line-height: 1.9;
        color: #b9c0c9;
    }

    .msg {
        max-width: 520px;
        padding: 8px 10px;
        font-size: 12.8px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        border-radius: 10px;
    }

    .msg.user {
        align-self: flex-end;
        max-width: 460px;
        background: #e9f1ff;
        color: #17407a;
        border-bottom-right-radius: 3px;
    }

    .msg.ai {
        align-self: flex-start;
        background: #fff;
        color: #23272d;
        border: 1px solid var(--line);
        border-bottom-left-radius: 3px;
    }

    /* agent 回复按 Markdown 渲染：.md 关掉 pre-wrap，交给块级元素排版 */
    .msg.md {
        white-space: normal;
    }

    .msg.ai p { margin: 0 0 6px; }
    .msg.ai p:last-child { margin-bottom: 0; }
    .msg.ai h3, .msg.ai h4, .msg.ai h5, .msg.ai h6 { margin: 8px 0 4px; font-size: 13.2px; line-height: 1.45; }
    .msg.ai h3 { font-size: 14px; }
    .msg.ai ul, .msg.ai ol { margin: 4px 0 6px; padding-left: 20px; }
    .msg.ai li { margin: 2px 0; }
    .msg.ai code {
        background: #f1f3f6; border-radius: 4px; padding: 0 4px; font-size: 12px;
        font-family: Consolas, "Courier New", monospace;
    }
    .msg.ai pre {
        margin: 6px 0; padding: 8px; background: #f6f8fa; border: 1px solid var(--line);
        border-radius: 6px; overflow: auto; max-height: 260px;
    }
    .msg.ai pre code { background: none; padding: 0; font-size: 11.8px; line-height: 1.5; white-space: pre; }
    .msg.ai blockquote { margin: 6px 0; padding: 2px 0 2px 8px; border-left: 3px solid #d6deea; color: #5b6472; }
    .msg.ai hr { border: none; border-top: 1px dashed var(--line); margin: 8px 0; }
    .msg.ai a { color: var(--accent); text-decoration: none; }
    .msg.ai table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
    .msg.ai th, .msg.ai td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; }
    .msg.ai th { background: #f6f8fa; font-weight: 600; }

    /* 历史气泡里补的「⚙ 用过 bash、read」小字 */
    .tooltag {
        margin-top: 5px;
        padding-top: 4px;
        border-top: 1px dashed var(--line);
        font-size: 11px;
        color: var(--muted);
    }

    .msg.edit {
        align-self: flex-start;
        background: #f3f0ff;
        color: #57429e;
        font-size: 12px;
        padding: 6px 9px;
    }

    .msg.sys {
        align-self: center;
        max-width: 100%;
        padding: 2px 0;
        color: #9aa2ac;
        font-size: 11.5px;
        text-align: center;
        background: transparent;
    }

    /* ---------- 输入区 ---------- */
    .composer {
        flex: 0 0 auto;
        position: relative;      /* 斜杠命令面板以它为定位基准 */
        /* 底部多留一点：WPS 状态栏会盖住窗格最下面十几像素 */
        padding: 9px 12px 16px;
        background: var(--panel);
        border-top: 1px solid var(--line);
    }

    /* ---------- 斜杠命令面板 ---------- */
    .cmdmenu {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: calc(100% - 4px);
        max-height: 232px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 10px 28px rgba(16, 24, 40, .16);
        z-index: 60;
        padding: 4px;
    }

    .cmdmenu .item {
        display: flex;
        gap: 7px;
        align-items: baseline;
        padding: 5px 8px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
        line-height: 1.4;
    }

    .cmdmenu .item:hover { background: #f2f6ff; }
    .cmdmenu .item.sel { background: #e8f0ff; }

    .cmdmenu .item .nm {
        flex: 0 0 auto;
        font-weight: 600;
        color: #2458c8;
        white-space: nowrap;
    }

    .cmdmenu .item .ds {
        flex: 1 1 auto;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .cmdmenu .empty {
        padding: 8px 10px;
        font-size: 11.5px;
        color: var(--muted);
    }

    textarea {
        display: block;
        width: 100%;
        min-height: 50px;
        max-height: 132px;
        padding: 8px 10px;
        font-family: inherit;
        font-size: 12.8px;
        line-height: 1.55;
        color: var(--text);
        background: #fff;
        border: 1px solid #dfe3e8;
        border-radius: 9px;
        outline: none;
        resize: none;
        overflow-y: auto;
        transition: border-color .15s, box-shadow .15s;
    }

    textarea::placeholder {
        color: #b3bac3;
    }

    textarea:focus {
        border-color: #8fb3ff;
        box-shadow: 0 0 0 3px rgba(47, 111, 237, .12);
    }

    .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
    }

    select {
        flex: 1 1 90px;
        min-width: 0;
        max-width: 118px;
        height: 30px;
        padding: 0 5px;
        font-family: inherit;
        font-size: 12.3px;
        color: #4a5461;
        background: #f7f8fa;
        border: 1px solid #e3e7ec;
        border-radius: 7px;
        outline: none;
        cursor: pointer;
    }

    select:focus {
        border-color: #8fb3ff;
    }

    
/* wps-* 指令块折叠（方案 A）：默认只显示一行明细，点开看原始 JSON */
.blkfold { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); }
.blkfold summary { cursor: pointer; user-select: none; outline: none; }
.blkfold summary:hover { color: var(--accent); }
.blkfold .blkraw {
    margin: 6px 0 0; padding: 8px; max-height: 220px; overflow: auto;
    background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px;
    font-size: 10.5px; line-height: 1.45; white-space: pre; color: #444;
}

.autoTip {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 11.6px;
        color: #8a919b;
        line-height: 1.35;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .btns {
        display: flex;
        gap: 6px;
        margin-left: auto;
        flex: 0 0 auto;
    }

    .btn {
        height: 30px;
        padding: 0 13px;
        font-family: inherit;
        font-size: 12.5px;
        color: #4a5461;
        background: #fff;
        border: 1px solid #e0e4ea;
        border-radius: 7px;
        cursor: pointer;
        transition: background .15s, border-color .15s, opacity .15s;
    }

    .btn:hover {
        background: #f5f7fa;
        border-color: #d3d9e1;
    }

    .btn.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
        box-shadow: 0 1px 3px rgba(47, 111, 237, .3);
    }

    .btn.primary:hover {
        background: #255fd8;
        border-color: #255fd8;
    }

    .btn.ghost {
        color: #77808c;
    }

    .btn.sm {
        height: 27px;
        padding: 0 11px;
        font-size: 12px;
    }

    .btn.undo {
        width: 100%;
        height: 27px;
        margin-top: 8px;
        font-size: 11.8px;
        color: #6b7480;
        background: #f6f8fa;
        border-color: #e8ebef;
    }

    .btn.undo:hover:not([disabled]) {
        color: var(--accent);
        border-color: #cdd9f0;
        background: #f2f6ff;
    }

    .btn.undo[disabled] {
        opacity: .45;
        cursor: default;
        background: #f8f9fb;
    }
</style>

</html>
